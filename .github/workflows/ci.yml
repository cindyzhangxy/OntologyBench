name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit and release-contract tests
        run: python -m unittest discover -s tests -v
      - name: Verify bundled task checksums
        run: ontologybench-verify
      - name: Validate benchmark and list tasks
        run: |
          ontologybench-validate
          ontologybench-evaluate --list-tasks
      - name: BM25 smoke test
        run: ontologybench-evaluate --backend bm25 --tasks 1A-R_gene_document_retrieval --no-wandb --no-save
